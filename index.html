<style>
:root{

  --border:#E2E2E6;--surface:#FAFAFA;--white:#FFFFFF;
  --red:#A32D2D;--green:#1B5E20;
  --ti-bg:#FFF3E0;--ti-fg:#7A3B00;
  --td-bg:#F0F7E6;--td-fg:#2A5A0A;
  --to-bg:#E6F1FB;--to-fg:#0C447C;
  --tr-bg:#FCE4EC;--tr-fg:#880E4F;
  --tl-bg:#F3F0E6;--tl-fg:#4A3B00;
  --tm-bg:#FDF6E3;--tm-fg:#7A5C00;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--ink);color:var(--ink);height:100vh;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh;background:var(--surface)}
#topbar{display:flex;align-items:center;gap:8px;padding:0 14px;height:50px;background:var(--navy);border-bottom:2px solid var(--gold);flex-shrink:0;flex-wrap:wrap}
#logo{font-size:12px;font-weight:600;color:#fff;letter-spacing:0.08em;text-transform:uppercase;white-space:nowrap;margin-right:4px}
#logo span{color:var(--gold)}
.fbtn{font-size:11px;padding:3px 11px;border-radius:20px;border:1px solid rgba(255,255,255,0.2);background:transparent;color:rgba(255,255,255,0.65);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.12s;white-space:nowrap}
.fbtn:hover{background:rgba(255,255,255,0.1);color:#fff}
.fbtn.active{background:var(--gold);color:var(--navy);border-color:var(--gold);font-weight:600}
#date-filter{font-size:11px;padding:3px 9px;border-radius:6px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.8);cursor:pointer;font-family:'DM Sans',sans-serif}
#date-filter option{background:#0C2340;color:#fff}
#refresh-btn{margin-left:4px;font-size:11px;padding:3px 11px;border-radius:6px;border:1px solid var(--gold);background:transparent;color:var(--gold);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.12s;white-space:nowrap}
#refresh-btn:hover{background:var(--gold);color:var(--navy)}
#refresh-btn:disabled{opacity:0.4;cursor:not-allowed}
#refresh-btn.auto-pulse{animation:pulse-gold 1.4s ease-in-out infinite}
@keyframes pulse-gold{0%,100%{box-shadow:0 0 0 0 rgba(201,168,76,0.5)}50%{box-shadow:0 0 0 5px rgba(201,168,76,0)}}
#last-checked{font-size:10px;color:rgba(255,255,255,0.35);font-family:'DM Mono',monospace;white-space:nowrap}
#story-count{font-size:11px;color:rgba(255,255,255,0.4);margin-left:auto;font-family:'DM Mono',monospace;white-space:nowrap}
.geo-exact{font-size:9px;color:#2e7d32;font-family:'DM Mono',monospace;margin-top:2px}
.geo-approx{font-size:9px;color:var(--muted);font-family:'DM Mono',monospace;margin-top:2px}
#overlay-bar{display:flex;align-items:center;gap:6px;padding:5px 14px;background:#0a1c30;border-bottom:1px solid rgba(201,168,76,0.2);flex-shrink:0;flex-wrap:wrap}
#overlay-label{font-size:10px;color:rgba(255,255,255,0.4);font-family:'DM Mono',monospace;white-space:nowrap;margin-right:2px;text-transform:uppercase;letter-spacing:0.06em}
.ovl-btn{font-size:10px;padding:2px 10px;border-radius:12px;border:1px solid rgba(255,255,255,0.18);background:transparent;color:rgba(255,255,255,0.5);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.12s;white-space:nowrap;display:flex;align-items:center;gap:5px}
.ovl-btn:hover{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.8)}
.ovl-btn.active.dot{background:rgba(255,140,0,0.15);color:#FF8C00;border-color:#FF8C00}
.ovl-btn.active.permits{background:rgba(30,136,229,0.15);color:#1E88E5;border-color:#1E88E5}
.ovl-btn.active.zoning{background:rgba(142,36,170,0.15);color:#8E24AA;border-color:#8E24AA}
.ovl-btn .ovl-dot{width:7px;height:7px;border-radius:2px;flex-shrink:0}
#overlay-status{font-size:10px;color:rgba(255,255,255,0.4);font-family:'DM Mono',monospace;margin-left:auto}
#main{display:flex;flex:1;overflow:hidden}
#map{flex:1;height:100%}
#sidebar{width:310px;display:flex;flex-direction:column;background:var(--white);border-left:1px solid var(--border);overflow:hidden}
#sidebar-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--surface)}
.stab{flex:1;padding:10px 4px;text-align:center;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;border:none;border-bottom:2px solid transparent;background:none;font-family:'DM Sans',sans-serif;letter-spacing:0.03em;transition:all 0.12s}
.stab:hover{color:var(--navy)}
.stab.active{color:var(--navy);border-bottom-color:var(--gold)}
#story-panel{flex:1;overflow-y:auto}
.story-card{padding:10px 13px;border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.1s;position:relative}
.story-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;transition:background 0.12s}
.story-card:hover{background:#F5F5F8}
.story-card.hl{background:var(--navy-light)}
.story-card.hl::before{background:var(--gold)}
.stag{display:inline-block;font-size:9px;padding:2px 7px;border-radius:10px;margin-bottom:3px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;font-family:'DM Mono',monospace}
.stitle{font-size:12px;font-weight:500;color:var(--ink);line-height:1.4;margin-bottom:2px}
.smeta{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace}
.snotes{font-size:11px;color:#333;margin-top:4px;line-height:1.5;border-left:2px solid var(--gold);padding-left:7px}
.slink{font-size:11px;color:var(--navy-mid);text-decoration:none;font-weight:600;display:inline-block;margin-top:4px}
.slink:hover{text-decoration:underline}
.ssource{font-size:10px;color:var(--muted);margin-top:2px;font-family:'DM Mono',monospace}
#empty-msg{padding:28px 16px;text-align:center;color:var(--muted);font-size:12px;line-height:1.8}
#add-panel{display:none;flex:1;overflow-y:auto;padding:14px}
#news-panel{display:none;flex:1;overflow-y:auto}
.news-card{padding:10px 13px;border-bottom:1px solid var(--border)}
.news-card h4{font-size:12px;font-weight:600;color:var(--navy);margin:0 0 4px;line-height:1.4}
.news-card .news-meta{font-size:10px;color:var(--muted);margin-bottom:4px}
.news-card .news-notes{font-size:11px;color:var(--ink);line-height:1.4}
.news-card a{font-size:10px;color:var(--gold);font-weight:600;text-decoration:none}
.news-badge{display:inline-block;background:#f0f4ff;color:#3355aa;font-size:9px;font-weight:700;padding:2px 6px;border-radius:3px;margin-right:4px;text-transform:uppercase;letter-spacing:0.05em}
#add-panel label{font-size:10px;font-weight:700;color:var(--muted);display:block;margin-bottom:3px;margin-top:11px;text-transform:uppercase;letter-spacing:0.06em;font-family:'DM Mono',monospace}
#add-panel label:first-of-type{margin-top:0}
#add-panel input,#add-panel select,#add-panel textarea{width:100%;padding:7px 9px;font-size:12px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--ink);font-family:'DM Sans',sans-serif}
#add-panel input:focus,#add-panel select:focus,#add-panel textarea:focus{outline:none;border-color:var(--navy-mid);box-shadow:0 0 0 2px rgba(24,95,165,0.1)}
#add-panel textarea{height:100px;resize:vertical}
#ai-btn{margin-top:10px;width:100%;padding:8px;font-size:12px;font-weight:600;background:var(--navy);color:#fff;border:none;border-radius:6px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:background 0.1s}
#ai-btn:hover{background:var(--navy-mid)}
#ai-btn:disabled{opacity:0.45;cursor:not-allowed}
#ai-status{font-size:11px;color:var(--navy-mid);margin-top:6px;min-height:14px;text-align:center}
.divider{height:1px;background:var(--border);margin:12px 0}
#add-btn{width:100%;padding:8px;font-size:12px;font-weight:600;background:var(--gold);color:var(--navy);border:none;border-radius:6px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.1s}
#add-btn:hover{background:#b8943d}
#add-msg{font-size:11px;margin-top:6px;text-align:center;min-height:14px}
#legend{display:flex;gap:8px;flex-wrap:wrap;padding:6px 13px;border-top:1px solid var(--border);flex-shrink:0;background:var(--surface)}
.leg{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--muted);font-family:'DM Mono',monospace}
.leg-dot{width:8px;height:8px;border-radius:50%;border:1.5px solid white;box-shadow:0 0 0 1px rgba(0,0,0,0.18)}
.leaflet-popup-content-wrapper{border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,0.15);font-family:'DM Sans',sans-serif}
.leaflet-popup-content{margin:11px 13px;min-width:200px}
.p-tag{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;padding:2px 7px;border-radius:8px;display:inline-block;margin-bottom:4px;font-family:'DM Mono',monospace}
.p-title{font-weight:600;font-size:12px;line-height:1.4;margin-bottom:3px;color:var(--ink)}
.p-meta{font-size:11px;color:var(--muted);margin-bottom:4px;font-family:'DM Mono',monospace}
.p-notes{font-size:11px;color:#333;margin-bottom:5px;line-height:1.5;border-left:2px solid var(--gold);padding-left:6px;font-style:italic}
.p-link{font-size:11px;font-weight:600;color:var(--navy-mid);text-decoration:none}
.p-link:hover{text-decoration:underline}
.p-source{font-size:10px;color:var(--muted);margin-top:3px;font-family:'DM Mono',monospace}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="logo">South Atlantic Sites <span>&#9679;</span> TBJ Deal Map</div>
    <button class="fbtn active" data-tag="all">All</button>
    <button class="fbtn" data-tag="industrial">Industrial</button>
    <button class="fbtn" data-tag="development">Development</button>
    <button class="fbtn" data-tag="office">Office</button>
    <button class="fbtn" data-tag="land">Land</button>
    <button class="fbtn" data-tag="retail">Retail</button>
    <select id="date-filter">
      <option value="all">All dates</option>
      <option value="7">This week</option>
      <option value="30">Last 30 days</option>
      <option value="90">Last 90 days</option>
    </select>
    <button id="refresh-btn" onclick="refreshFeed()">&#8635; Refresh Feed</button>
    <span id="last-checked"></span>
    <span id="story-count">&#8212; stories</span>
  </div>

  <div id="overlay-bar">
    <span id="overlay-label">Overlays:</span>
    <button class="ovl-btn dot" onclick="toggleOverlay('dot',this)">
      <span class="ovl-dot" style="background:#FF8C00"></span> NCDOT Projects
    </button>
    <button class="ovl-btn permits" onclick="toggleOverlay('permits',this)">
      <span class="ovl-dot" style="background:#1E88E5"></span> Filed Permits
    </button>
    <button class="ovl-btn zoning" onclick="toggleOverlay('zoning',this)">
      <span class="ovl-dot" style="background:#8E24AA"></span> Zoning / Rezoning
    </button>
    <span id="overlay-status"></span>
  </div>

  <div id="main">
    <div id="map"></div>
    <div id="sidebar">
      <div id="sidebar-tabs">
        <button class="stab active" data-tab="stories">Feed</button>
        <button class="stab" data-tab="news">&#128�; News</button>
        <button class="stab" data-tab="add">+ Pin Story</button>
      </div>
      <div id="story-panel">
        <div id="empty-msg" style="display:none">No stories match your current filters.<br><br>Use <strong>+ Pin Story</strong> to add new deals, or adjust the filters above.</div>
      </div>
      <div id="news-panel">
        <div id="news-empty-msg">No news stories yet.<br><br>Hit <strong>&#8635; Refresh Feed</strong> to check for TBJ stories.</div>
      </div>
      <div id="add-panel">
        <label>Paste TBJ Article Text *</label>
        <textarea id="in-text" placeholder="Copy the full article text from TBJ and paste here. Claude will extract headline, location, deal type, and key facts.&#10;&#10;Then click Extract below."></textarea>
        <button id="ai-btn" onclick="runExtract()">&#9889; Extract &amp; Auto-Fill</button>
        <div id="ai-status"></div>
        <div class="divider"></div>
        <label>Headline</label>
        <input id="in-title" type="text" placeholder="Auto-filled from article"/>
        <label>TBJ Article URL</label>
        <input id="in-url" type="text" placeholder="Auto-filled or paste manually"/>
        <label>Location</label>
        <select id="in-loc"></select>
        <label>Category</label>
        <select id="in-tag">
          <option value="industrial">Industrial</option>
          <option value="development">Development</option>
          <option value="office">Office</option>
          <option value="land">Land</option>
          <option value="retail">Retail</option>
        </select>
        <label>Street Address <span style="font-weight:400;text-transform:none;letter-spacing:0">(for exact pin)</span></label>
        <input id="in-address" type="text" placeholder="e.g. 123 Main St, Cary — auto-filled or type manually"/>
        <label>Deal Notes</label>
        <input id="in-notes" type="text" placeholder="Auto-filled — SF, price, tenants..."/>
        <br/><br/>
        <button id="add-btn" onclick="addStory()">Pin to Map</button>
        <div id="add-msg"></div>
      </div>
      <div id="legend">
        <div class="leg"><div class="leg-dot" style="background:#8B4513"></div>Industrial</div>
        <div class="leg"><div class="leg-dot" style="background:#2E7D32"></div>Development</div>
        <div class="leg"><div class="leg-dot" style="background:#1565C0"></div>Office</div>
        <div class="leg"><div class="leg-dot" style="background:#6A1B9A"></div>Land</div>
        <div class="leg"><div class="leg-dot" style="background:#AD1457"></div>Retail</div>
        <div class="leg"><div class="leg-dot" style="background:#C9A84C"></div>Pinned</div>
        <div class="leg" id="leg-dot" style="display:none"><div class="leg-dot" style="background:#FF8C00;border-radius:2px"></div>DOT</div>
        <div class="leg" id="leg-permits" style="display:none"><div class="leg-dot" style="background:#1E88E5;border-radius:2px"></div>Permit</div>
        <div class="leg" id="leg-zoning" style="display:none"><div class="leg-dot" style="background:#8E24AA;border-radius:2px"></div>Zoning</div>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

function detectTag(text){
  const t=text.toLowerCase();
  if(/industrial|logistics|distribution|manufacturing|warehouse|fulfillment|data.center/.test(t))return'industrial';
  if(/development|developer|construction|rezoning|permit|groundbreaking|mixed.use/.test(t))return'development';
  if(/retail|restaurant|brewery|hotel|hospitality/.test(t))return'retail';
  if(/\bland\b|acres|parcel|site|zoning/.test(t))return'land';
  return'office';
}
function detectLoc(text){
  for(const p of PLACES){
    const re=new RegExp('\\b'+p.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');
    if(re.test(text))return p.name;
  }
  return null;
}

// ── Geocoder ───────────────────────────────────────────────────
const geocodeCache={};
async function geocodeAddress(address){
  if(!address)return null;
  const key=address.toLowerCase().trim();
  if(geocodeCache[key])return geocodeCache[key];
  try{
    const query=encodeURIComponent(address+', North Carolina, USA');
    const resp=await fetch(`https://nominatim.openstreetmap.org/search?q=${query}&format=json&limit=1&countrycodes=us`,
      {headers:{'Accept-Language':'en','User-Agent':'SAS-TBJ-DealMap/1.0'}});
    const data=await resp.json();
    if(data&&data[0]){
      const r={lat:parseFloat(data[0].lat),lng:parseFloat(data[0].lon)};
      geocodeCache[key]=r; return r;
    }
  }catch(e){}
  return null;
}

// ── AI Article Geocoder ────────────────────────────────────────
const aiGeoCache={};
async function aiGeocodeArticle(title,url,existingNotes){
  const cacheKey=url||title.substring(0,60);
  if(aiGeoCache[cacheKey])return aiGeoCache[cacheKey];
  try{
    let articleText=title+' '+(existingNotes||'');
    if(url&&url.includes('bizjournals.com')){
      try{
        const resp=await fetch(CORS_PROXY+encodeURIComponent(url),{signal:AbortSignal.timeout(8000)});
        const data=await resp.json();
        if(data.contents){
          const tmp=document.createElement('div');
          tmp.innerHTML=data.contents;
          articleText=(tmp.innerText||tmp.textContent||'').substring(0,3000);
        }
      }catch(e){}
    }
    const locList=PLACES.map(p=>p.name).join(', ');
    const prompt=`From this Triangle Business Journal article, extract:
1. Street address of the property (e.g. "800 CentreGreen Way, Cary") — only if explicitly mentioned
2. Best submarket from: ${locList}
Return ONLY valid JSON: {"address":"full street address or empty string","loc":"submarket name"}
Title: ${title}
Text: ${articleText.substring(0,2000)}`;
    const resp=await fetch(ANTHROPIC_API,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:150,messages:[{role:'user',content:prompt}]})});
    const data=await resp.json();
    const parsed=JSON.parse((data.content?.[0]?.text||'').replace(/```json|```/g,'').trim());
    let result={address:parsed.address||'',loc:parsed.loc||''};
    if(result.address){
      const geo=await geocodeAddress(result.address);
      if(geo&&geo.lat>35.2&&geo.lat<36.6&&geo.lng>-80.0&&geo.lng<-77.8){result.lat=geo.lat;result.lng=geo.lng;}
    }
    aiGeoCache[cacheKey]=result; return result;
  }catch(e){return null;}
}

// ── Gmail Refresh ──────────────────────────────────────────────
async function refreshFeed(isAuto=false){
  const btn=document.getElementById('refresh-btn');
  const countEl=document.getElementById('story-count');
  btn.disabled=true;
  btn.textContent=isAuto?'⟳ Auto-checking...':'Checking Gmail...';
  try{
    const searchResp=await fetch('https://gmail.mcp.claude.com/mcp',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({method:'tools/call',params:{name:'gmail_search_messages',
        arguments:{q:'(from:mike@southatlanticsites.com subject:Fwd) OR (from:reply@news.bizjournals.com) newer_than:60d',maxResults:30}}})
    });
    if(!searchResp.ok)throw new Error('Gmail MCP unreachable');
    const searchData=await searchResp.json();
    const messages=searchData?.result?.messages||[];
    if(!messages.length){btn.disabled=false;btn.textContent='⟳ Refresh Feed';return;}
    const existing=new Set(allStories.map(s=>s.title.toLowerCase().substring(0,60)));
    let added=0;
    for(const msg of messages.slice(0,20)){
      try{
        const msgResp=await fetch('https://gmail.mcp.claude.com/mcp',{
          method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({method:'tools/call',params:{name:'gmail_read_message',arguments:{messageId:msg.id}}})
        });
        const email=(await msgResp.json())?.result;
        if(!email)continue;
        const body=email.body||'';
        const dateIso=email.headers?.Date?new Date(email.headers.Date).toISOString().split('T')[0]:new Date().toISOString().split('T')[0];
        function decodeTBJUrl(b64){
          try{const padded=b64+'='.repeat((4-b64.length%4)%4);return atob(padded).split('?')[0];}catch(e){return null;}
        }
        const digestStories=[];
        const lines=body.split('\n').map(l=>l.trim()).filter(Boolean);
        for(let i=0;i<lines.length-1;i++){
          const line=lines[i],nextLine=lines[i+1]||'';
          const urlMatch=nextLine.match(/https?:\/\/link\.bizjournals\.com\/click\/[^/]+\/([A-Za-z0-9+/=_-]+)\//);
          if(!urlMatch)continue;
          const realUrl=decodeTBJUrl(urlMatch[1]);
          if(!realUrl||!realUrl.includes('bizjournals.com/triangle/news/'))continue;
          const skip=['Read full story','View in Browser','Quick Links','Unsubscribe','Manage Preferences','UPCOMING EVENTS','START YOUR FREE TRIAL'];
          if(skip.some(s=>line.includes(s)))continue;
          if(line.length<10||line.startsWith('<')||line.startsWith('http'))continue;
          digestStories.push({title:line,link:realUrl});
        }
        if(!digestStories.length){
          const subj=(email.headers?.Subject||'').replace(/^(Fwd?:\s*)+/i,'').trim();
          if(subj){
            const du=body.match(/https?:\/\/(?:www\.)?bizjournals\.com\/triangle\/news\/[^\s"<>)]+/);
            digestStories.push({title:subj,link:du?du[0]:'https://www.bizjournals.com/triangle/news/commercial-real-estate'});
          }
        }
        for(const ds of digestStories){
          const titleKey=ds.title.toLowerCase().substring(0,60);
          if(existing.has(titleKey))continue;
          existing.add(titleKey);
          let detectedLoc=detectLoc(ds.title),storyAddress='',preciseLat=null,preciseLng=null;
          if(ds.link&&ds.link.includes('bizjournals.com/triangle/news/')){
            try{
              const aiGeo=await aiGeocodeArticle(ds.title,ds.link,'');
              if(aiGeo){
                if(aiGeo.address)storyAddress=aiGeo.address;
                if(aiGeo.loc&&!detectedLoc)detectedLoc=aiGeo.loc;
                if(aiGeo.lat&&aiGeo.lng){preciseLat=aiGeo.lat;preciseLng=aiGeo.lng;}
              }
            }catch(e){}
          }
          if(detectedLoc||preciseLat){
            const story={title:ds.title.substring(0,160),link:ds.link,notes:'',
              tag:detectTag(ds.title),loc:detectedLoc||'Triangle',date:dateIso,source:'gmail',manual:false,address:storyAddress};
            if(preciseLat){story._lat=preciseLat;story._lng=preciseLng;story._precise=true;}
            allStories.unshift(story);added++;
          }else{
            addNewsStory({title:ds.title.substring(0,160),link:ds.link,notes:'',tag:detectTag(ds.title),date:dateIso});
          }
        }
      }catch(e){console.warn('msg failed',msg.id,e.message);}
    }
    btn.disabled=false;btn.textContent='⟳ Refresh Feed';
    lastCheckedAt=Date.now();updateLastChecked();
    renderAll();renderNews();updateNewsTabCount();
    countEl.textContent=getFiltered().length+' stories';
  }catch(e){
    console.error('Gmail feed error:',e);
    btn.disabled=false;btn.textContent='⟳ Refresh Feed';
    lastCheckedAt=Date.now();updateLastChecked();
  }
}

// ── AI Extraction ──────────────────────────────────────────────
async function runExtract(){
  const text=document.getElementById('in-text').value.trim();
  const btn=document.getElementById('ai-btn');
  const status=document.getElementById('ai-status');
  if(!text){status.textContent='Paste article text first.';status.style.color='var(--red)';return;}
  btn.disabled=true;btn.textContent='Extracting...';
  status.textContent='Calling Claude...';status.style.color='var(--navy-mid)';
  const locList=PLACES.map(p=>p.name).join(', ');
  const prompt=`Extract CRE deal info from this TBJ article. Return ONLY valid JSON, no markdown.
{
  "title":"concise deal headline, max 120 chars",
  "url":"bizjournals.com article URL if present, else empty string",
  "location":"best match from: ${locList}",
  "address":"street address if mentioned (e.g. '123 Main St, Cary'), else empty string",
  "tag":"one of: industrial, development, office, land, retail",
  "notes":"key facts: SF or acres, price, tenant/buyer/seller — 1-2 sentences",
  "date":"YYYY-MM-DD if found, else today ${new Date().toISOString().slice(0,10)}"
}
Article: ${text.substring(0,4000)}`;
  try{
    const resp=await fetch(ANTHROPIC_API,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:600,messages:[{role:'user',content:prompt}]})});
    const data=await resp.json();
    const p=JSON.parse((data.content?.[0]?.text||'').replace(/```json|```/g,'').trim());
    if(p.title)document.getElementById('in-title').value=p.title;
    if(p.url)document.getElementById('in-url').value=p.url;
    if(p.notes)document.getElementById('in-notes').value=p.notes;
    if(p.date)document.getElementById('ai-btn').dataset.date=p.date;
    if(p.address){document.getElementById('ai-btn').dataset.address=p.address;document.getElementById('in-address').value=p.address;}
    if(p.location){const sel=document.getElementById('in-loc');const opt=Array.from(sel.options).find(o=>o.value===p.location);if(opt)sel.value=p.location;}
    if(p.tag){const sel=document.getElementById('in-tag');const opt=Array.from(sel.options).find(o=>o.value===p.tag);if(opt)sel.value=p.tag;}
    status.textContent='Done — review then hit Pin to Map.';status.style.color='var(--green)';
    btn.textContent='⚡ Extract & Auto-Fill';btn.disabled=false;
  }catch(e){
    status.textContent='Extract failed: '+e.message;status.style.color='var(--red)';
    btn.textContent='⚡ Extract & Auto-Fill';btn.disabled=false;
  }
}

// ── Add Story ──────────────────────────────────────────────────
async function addStory(){
  const title=document.getElementById('in-title').value.trim();
  const url=document.getElementById('in-url').value.trim();
  const loc=document.getElementById('in-loc').value;
  const tag=document.getElementById('in-tag').value;
  const notes=document.getElementById('in-notes').value.trim();
  const date=document.getElementById('ai-btn').dataset.date||new Date().toISOString().slice(0,10);
  const address=document.getElementById('in-address').value.trim()||document.getElementById('ai-btn').dataset.address||'';
  const msg=document.getElementById('add-msg');
  if(!title){msg.textContent='Headline required.';msg.style.color='var(--red)';return;}
  const story={title,link:url||'https://www.bizjournals.com/triangle/news/commercial-real-estate',
    notes,tag,loc,date,address,source:'manual',manual:true,_id:Date.now()};
  if(address){
    msg.textContent='Geocoding address...';msg.style.color='var(--navy-mid)';
    const geo=await geocodeAddress(address);
    if(geo&&geo.lat>35.2&&geo.lat<36.6&&geo.lng>-80.0&&geo.lng<-77.8){
      story._lat=geo.lat;story._lng=geo.lng;story._precise=true;
    }
  }
  allStories.unshift(story);
  const pins=loadPins();pins.unshift(story);savePins(pins);
  msg.textContent=story._precise?'📍 Pinned to exact address!':'Pinned!';
  msg.style.color='var(--green)';
  ['in-title','in-url','in-notes','in-text','in-address'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('ai-status').textContent='';
  delete document.getElementById('ai-btn').dataset.date;
  delete document.getElementById('ai-btn').dataset.address;
  setTimeout(()=>{msg.textContent='';},2500);
  document.querySelector('.stab[data-tab="stories"]').click();
  renderAll();
}

function getFiltered(){
  let s=allStories;
  if(activeFilter!=='all')s=s.filter(x=>x.tag===activeFilter);
  if(activeDays!=='all'){const cut=Date.now()-parseInt(activeDays)*86400000;s=s.filter(x=>x.manual||dateMs(x.date)>cut);}
  return s;
}
function renderAll(){
  activeMarkers.forEach(m=>map.removeLayer(m));activeMarkers=[];
  const panel=document.getElementById('story-panel');
  panel.querySelectorAll('.story-card').forEach(c=>c.remove());
  const filtered=getFiltered();
  document.getElementById('story-count').textContent=filtered.length+' stories';
  document.querySelector('.stab[data-tab="stories"]').textContent='Feed ('+filtered.length+')';
  const emptyMsg=document.getElementById('empty-msg');
  if(emptyMsg)emptyMsg.style.display=filtered.length===0?'block':'none';
  filtered.forEach(story=>{
    const tagKey=story.manual?'manual':story.tag;
    const tagStyle=TAG_CSS[tagKey]||TAG_CSS.office;
    const place=findPlace(story.loc);
    const sourceLabel=story.source==='gmail'?'via TBJ Newsletter':story.source==='manual'?'manually pinned':'seed data';
    const card=document.createElement('div');
    card.className='story-card';
    card.innerHTML=
      `<span class="stag" style="${tagStyle}">${story.manual?'pinned':story.tag}</span>`+
      `<div class="stitle">${story.title}</div>`+
      `<div class="smeta">${story.loc||'Triangle'} &middot; ${fmtDate(story.date)}</div>`+
      (story._precise?`<div class="geo-exact">📍 ${story.address}</div>`:'')+
      (story.notes?`<div class="snotes">${story.notes}</div>`:'')+
      (story.link?`<a class="slink" href="${story.link}" target="_blank">Read on TBJ &rarr;</a>`:'')+
      `<div class="ssource">${sourceLabel}</div>`;
    if(place||story._lat){
      if(!story._lat){story._lat=jitter(place.lat);story._lng=jitter(place.lng);}
      const precise=story._precise===true;
      const m=L.marker([story._lat,story._lng],{icon:makeIcon(story.tag,story.manual,precise)}).addTo(map);
      const geoLabel=precise?`<div class="geo-exact">📍 ${story.address||'exact address'}</div>`:`<div class="geo-approx">◎ ${story.loc||'Triangle'} area</div>`;
      m.bindPopup(
        `<span class="p-tag" style="${tagStyle}">${story.manual?'pinned':story.tag}</span>`+
        `<div class="p-title">${story.title}</div>`+
        `<div class="p-meta">${fmtDate(story.date)}</div>`+geoLabel+
        (story.notes?`<div class="p-notes">${story.notes}</div>`:'')+
        (story.link?`<a class="p-link" href="${story.link}" target="_blank">Read full story on TBJ &rarr;</a>`:'')+
        `<div class="p-source">${sourceLabel}</div>`,{maxWidth:260});
      m.on('click',()=>{panel.querySelectorAll('.story-card').forEach(c=>c.classList.remove('hl'));card.classList.add('hl');card.scrollIntoView({behavior:'smooth',block:'nearest'});});
      card.addEventListener('click',()=>{panel.querySelectorAll('.story-card').forEach(c=>c.classList.remove('hl'));card.classList.add('hl');map.setView([story._lat,story._lng],13,{animate:true});m.openPopup();});
      activeMarkers.push(m);
    }else if(!story._lat){card.style.opacity='0.55';card.title='No Triangle location detected';}
    panel.appendChild(card);
  });
}

function fetchDotLayer(){
  setOverlayStatus('Loading NCDOT STIP 2026-2035...');
  const lg=L.layerGroup();
  const statusColor = {
    'Under Construction':'#E65100',
    'Phase 2 Under Construction':'#E65100',
    'ROW Acquisition':'#FF8C00',
    'ROW Acquisition 2026':'#FF8C00',
    'Design/Engineering':'#FFC107',
    'Programmed':'#FF8C00',
    'Planning/Public Meeting 2026':'#FFD54F',
    'Preliminary Engineering Only':'#BDBDBD',
  };
  for(const p of STIP_PROJECTS){
    const color = statusColor[p.status] || '#FF8C00';
    const m = L.marker([p.lat, p.lng], {icon: L.divIcon({className:'',
      html:`<div style="width:15px;height:15px;border:2.5px solid ${color};background:${color}33;border-radius:2px;box-shadow:0 1px 5px rgba(0,0,0,0.5)"></div>`,
      iconSize:[15,15],iconAnchor:[7,7],popupAnchor:[0,-10]})});
    const rowStr = p.row_year ? `ROW: ${p.row_year}` : 'ROW: TBD';
    const constStr = p.const_year ? `Construction: ${p.const_year}` : 'Construction: TBD';
    const complStr = p.completion_year ? `Est. completion: ${p.completion_year}` : '';
    m.bindPopup(
      `<span class="p-tag" style="background:${color};color:#fff">NCDOT ${p.id}</span>`+
      `<div class="p-title">${p.desc}</div>`+
      `<div class="p-meta">${p.county} County · ${p.route}</div>`+
      `<div class="p-notes">${p.detail}</div>`+
      `<div class="p-meta" style="margin-top:4px"><strong>Status:</strong> ${p.status}</div>`+
      `<div class="p-meta">${rowStr} &nbsp;|&nbsp; ${constStr}${complStr?' &nbsp;|&nbsp; '+complStr:''}</div>`+
      `<div class="p-meta"><strong>Cost:</strong> ${p.cost}</div>`+
      `<div style="margin-top:6px;display:flex;flex-direction:column;gap:3px">`+
      `<a class="p-link" href="${p.url}" target="_blank" style="color:#E65100">&#128279; Project details &rarr;</a>`+
      `<a class="p-link" href="${p.ncdot}" target="_blank" style="color:#E65100">&#128336; NCDOT STIP entry &rarr;</a>`+
      `<a class="p-link" href="https://www.ncdot.gov/initiatives-policies/Transportation/stip/Pages/stip-projects-map.aspx" target="_blank" style="color:#E65100">&#128506; Full STIP map &rarr;</a>`+
      `</div>`,
      {maxWidth:300});
    lg.addLayer(m);
  }
  setOverlayStatus(`${STIP_PROJECTS.length} NCDOT STIP projects loaded`);
  setTimeout(()=>setOverlayStatus(''),3000);
  return lg;
}

async function fetchPermitsLayer(){
  setOverlayStatus('Loading filed permits...');
  const lg=L.layerGroup();
  const where=encodeURIComponent("permitclassmapped='Non-Residential' AND latitude_perm IS NOT NULL");
  const fields='permitnum,projectname,description,originaladdress1,originalcity,estprojectcost,totalsqft,workclassmapped,statuscurrentmapped,issueddate,latitude_perm,longitude_perm,landusedescription';
  const url=RALEIGH_BASE+`Building_Permits_Past_31_Days/FeatureServer/0/query?where=${where}&outFields=${fields}&f=json&resultRecordCount=500&orderByFields=issueddate+DESC`;
  const data=(await (await fetch(url,{signal:AbortSignal.timeout(10000)})).json());
  let count=0;
  for(const feat of(data.features||[])){
    const a=feat.attributes;
    const lat=a.latitude_perm,lng=a.longitude_perm;
    if(!lat||!lng)continue;
    if((a.estprojectcost||0)<50000&&!a.totalsqft)continue;
    const cost=a.estprojectcost?'$'+(a.estprojectcost>=1e6?(a.estprojectcost/1e6).toFixed(1)+'M':(a.estprojectcost/1000).toFixed(0)+'K'):'';
    const sqft=a.totalsqft?`${a.totalsqft.toLocaleString()} SF`:'';
    const issued=a.issueddate?new Date(a.issueddate).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'';
    const addr=[a.originaladdress1,a.originalcity].filter(Boolean).join(', ');
    const m=L.marker([lat,lng],{icon:makePermitIcon()});
    m.bindPopup(
      `<span class="p-tag" style="background:#1E88E5;color:#fff">PERMIT</span>`+
      `<div class="p-title">${a.projectname||a.description||'Building Permit'}</div>`+
      `<div class="p-meta">${addr}</div>`+
      `<div class="p-notes">${[a.workclassmapped,a.landusedescription,sqft,cost].filter(Boolean).join(' · ')}</div>`+
      `<div class="p-meta">Issued ${issued} · ${a.statuscurrentmapped||''}</div>`+
      `<div class="p-source">${a.permitnum||''}</div>` +
      `<div style="margin-top:5px;display:flex;flex-direction:column;gap:3px">` +
      (a.permitnum ? `<a class="p-link" href="https://raleighnc.gov/services/permits/check-permit-status?permit=${encodeURIComponent(a.permitnum)}" target="_blank" style="color:#1E88E5">&#128196; Check permit status &rarr;</a>` : '') +
      `<a class="p-link" href="https://maps.raleighnc.gov/iMAPS/?address=${encodeURIComponent((a.originaladdress1||'')+', Raleigh, NC')}" target="_blank" style="color:#1E88E5">&#128205; View on iMAPS &rarr;</a>` +
      `</div>`,{maxWidth:280});
    lg.addLayer(m);count++;
  }
  setOverlayStatus(`${count} commercial permits loaded`);
  setTimeout(()=>setOverlayStatus(''),3000);
  return lg;
}

async function fetchZoningLayer(){
  setOverlayStatus('Loading zoning cases...');
  const lg=L.layerGroup();
  // *** KEY FIX: use timestamp string format (NOT epoch ms) + outSR=4326 for proper coordinates ***
  const zoningUrl=RALEIGH_BASE+`Rezoning_Case_Boundaries_View/FeatureServer/0/query?where=StatusDate+>+timestamp+'2023-01-01+00:00:00'&outFields=ZONE_CASE,Location,Acres,PrevZoning,ZON_REQ,STATUS,StatusDate,CASE_TYPE,CurrentInfoLink,IMAPS_Link,EG_Link&f=json&resultRecordCount=300&outSR=4326`;
  const dpUrl=RALEIGH_BASE+`Development_Plans/FeatureServer/0/query?where=status+IN+('Review+In+Progress','Pending','Filed','Submitted')&outFields=plan_name,plan_number,plan_type,status,major_street,developer,acreage,submitted,zoning&f=json&resultRecordCount=200`;
  const [zData,dpData]=await Promise.all([
    fetch(zoningUrl,{signal:AbortSignal.timeout(10000)}).then(r=>r.json()),
    fetch(dpUrl,{signal:AbortSignal.timeout(10000)}).then(r=>r.json())
  ]);
  let count=0;
  for(const feat of(zData.features||[])){
    const a=feat.attributes,geom=feat.geometry;
    if(!geom?.rings)continue;
    // outSR=4326 means rings are already [lng,lat]
    const ll=geom.rings[0].map(([x,y])=>[y,x]);
    const statusColor=a.STATUS==='Approved'?'#2E7D32':a.STATUS==='Withdrawn'||a.STATUS==='Denied'?'#888':'#8E24AA';
    const poly=L.polygon(ll,{color:statusColor,weight:2,fillColor:statusColor,fillOpacity:0.1});
    const statusDate=a.StatusDate?new Date(a.StatusDate).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'';
    const popup=
      `<span class="p-tag" style="background:${statusColor};color:#fff">REZONING</span>`+
      `<div class="p-title">${a.ZONE_CASE||''} &mdash; ${a.ZON_REQ||'Requested'}</div>`+
      `<div class="p-notes">${[a.Acres?a.Acres.toFixed(1)+' acres':'',a.PrevZoning?'From: '+a.PrevZoning:'',a.Location||''].filter(Boolean).join(' · ')}</div>`+
      `<div class="p-meta">Status: ${a.STATUS||''} · ${statusDate}</div>`+
      `<div style="margin-top:5px;display:flex;flex-direction:column;gap:3px">`+
      (a.IMAPS_Link?`<a class="p-link" href="${a.IMAPS_Link}" target="_blank" style="color:#8E24AA">&#128205; View parcel on iMAPS &rarr;</a>`:`<a class="p-link" href="https://maps.raleighnc.gov/iMAPS/" target="_blank" style="color:#8E24AA">&#128205; Raleigh iMAPS &rarr;</a>`)+
      (a.EG_Link?`<a class="p-link" href="${a.EG_Link}" target="_blank" style="color:#8E24AA">&#128196; Case documents &rarr;</a>`:'')+
      `<a class="p-link" href="https://raleighnc.gov/planning/services/rezoning-cases" target="_blank" style="color:#8E24AA">&#128196; Raleigh rezoning portal &rarr;</a>`+
      `</div>`;
    poly.bindPopup(popup,{maxWidth:260});
    try{const center=L.polygon(ll).getBounds().getCenter();const m=L.marker([center.lat,center.lng],{icon:makeZoningIcon()});m.bindPopup(popup,{maxWidth:260});lg.addLayer(m);}catch(e){}
    lg.addLayer(poly);count++;
  }
  for(const feat of(dpData.features||[])){
    const a=feat.attributes,geom=feat.geometry;
    if(!geom?.x||!geom?.y)continue;
    const submitted=a.submitted?new Date(a.submitted).toLocaleDateString('en-US',{month:'short',year:'numeric'}):'';
    const m=L.marker([geom.y,geom.x],{icon:makeZoningIcon()});
    m.bindPopup(
      `<span class="p-tag" style="background:#8E24AA;color:#fff">DEV PLAN</span>`+
      `<div class="p-title">${a.plan_name||a.plan_number||'Development Plan'}</div>`+
      `<div class="p-notes">${[a.plan_type,a.major_street?'Near '+a.major_street.trim():'',a.acreage?a.acreage.toFixed(1)+' ac':'',a.developer||''].filter(Boolean).join(' · ')}</div>`+
      `<div class="p-meta">Status: ${a.status||''} · Submitted ${submitted}</div>`+
      `<div style="margin-top:5px;display:flex;flex-direction:column;gap:3px">`+
      `<a class="p-link" href="https://raleighnc.gov/permits-development/services/development-plans-rezoning" target="_blank" style="color:#8E24AA">&#128196; Raleigh dev plans portal &rarr;</a>`+
      `<a class="p-link" href="https://maps.raleighnc.gov/iMAPS/" target="_blank" style="color:#8E24AA">&#128205; Raleigh iMAPS &rarr;</a>`+
      `</div>`,{maxWidth:280});
    lg.addLayer(m);count++;
  }
  setOverlayStatus(`${count} zoning items loaded`);
  setTimeout(()=>setOverlayStatus(''),3000);
  return lg;
}

async function toggleOverlay(type,btn){
  if(overlayActive[type]){
    if(overlayLayers[type])map.removeLayer(overlayLayers[type]);
    overlayActive[type]=false;btn.classList.remove('active');
    const legEl=document.getElementById('leg-'+type);if(legEl)legEl.style.display='none';
    setOverlayStatus('');return;
  }
  overlayActive[type]=true;btn.classList.add('active');
  const legEl=document.getElementById('leg-'+type);if(legEl)legEl.style.display='flex';
  if(!overlayLoaded[type]){
    btn.disabled=true;btn.style.opacity='0.6';
    try{
      if(type==='dot')overlayLayers[type]=fetchDotLayer();
      else if(type==='permits')overlayLayers[type]=await fetchPermitsLayer();
      else if(type==='zoning')overlayLayers[type]=await fetchZoningLayer();
      overlayLoaded[type]=true;
    }catch(e){
      console.error('Overlay failed:',type,e);
      setOverlayStatus('⚠ Failed to load '+type+' data');
      overlayActive[type]=false;btn.classList.remove('active');
      if(legEl)legEl.style.display='none';
      setTimeout(()=>setOverlayStatus(''),3000);
    }
    btn.disabled=false;btn.style.opacity='';
  }
  if(overlayLayers[type])overlayLayers[type].addTo(map);
}

// ── Boot ───────────────────────────────────────────────────────
function boot(){
  initMap();
  const locSel=document.getElementById('in-loc');
  PLACES.forEach(p=>{const o=document.createElement('option');o.value=p.name;o.textContent=p.name;locSel.appendChild(o);});
  SEED.forEach(s=>allStories.push(Object.assign({},s)));
  SEED_NEWS.forEach(s=>addNewsStory(s));
  const pins=loadPins();
  const seedTitles=new Set(SEED.map(s=>s.title));
  pins.forEach(p=>{if(!seedTitles.has(p.title))allStories.unshift(p);});
  document.querySelectorAll('.fbtn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');activeFilter=btn.dataset.tag;renderAll();
    });
  });
  document.getElementById('date-filter').addEventListener('change',e=>{activeDays=e.target.value;renderAll();});
  document.querySelectorAll('.stab').forEach(tab=>{
    tab.addEventListener('click',()=>{
      document.querySelectorAll('.stab').forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      const t=tab.dataset.tab;
      document.getElementById('story-panel').style.display=t==='stories'?'block':'none';
      document.getElementById('news-panel').style.display=t==='news'?'block':'none';
      document.getElementById('add-panel').style.display=t==='add'?'block':'none';
    });
  });
  renderAll();
  startAutoRefresh();
}

// ── News Tab ───────────────────────────────────────────────────
const newsStories=[];
function addNewsStory(story){
  if(newsStories.some(n=>n.title.toLowerCase().substring(0,60)===story.title.toLowerCase().substring(0,60)))return;
  newsStories.unshift(story);renderNews();updateNewsTabCount();
}
function updateNewsTabCount(){
  const btn=document.querySelector('.stab[data-tab="news"]');
  if(btn)btn.textContent=newsStories.length>0?`📰 News (${newsStories.length})`:'📰 News';
}
const TAG_COLORS={industrial:'#d97706',development:'#0369a1',office:'#7c3aed',retail:'#be185d',land:'#15803d',other:'#6b7280'};
function renderNews(){
  const panel=document.getElementById('news-panel');
  const em=document.getElementById('news-empty-msg');
  if(!newsStories.length){if(em)em.style.display='block';return;}
  if(em)em.style.display='none';
  panel.querySelectorAll('.news-card').forEach(c=>c.remove());
  newsStories.forEach(s=>{
    const div=document.createElement('div');div.className='news-card';
    const color=TAG_COLORS[s.tag]||TAG_COLORS.other;
    const dateStr=s.date?new Date(s.date).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'';
    div.innerHTML=`<div class="news-meta"><span class="news-badge" style="background:${color}22;color:${color}">${s.tag||'news'}</span>${dateStr}</div><h4>${s.title}</h4>${s.notes?`<div class="news-notes">${s.notes}</div>`:''}${s.link?`<a href="${s.link}" target="_blank">Read on TBJ &rarr;</a>`:''}`;
    panel.appendChild(div);
  });
}

boot();
</script>
